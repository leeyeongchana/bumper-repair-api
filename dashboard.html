<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>범퍼 수정 현황 | 캠스</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#f0f2f7;color:#1e293b;min-height:100vh;}
.header{background:#fff;border-bottom:4px solid #1a3f8f;padding:10px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.07);}
.header-left{display:flex;align-items:center;gap:16px;}
.logo-wrap{height:44px;display:flex;align-items:center;}
.logo-cams{font-size:22px;font-weight:700;color:#1a3f8f;letter-spacing:-0.3px;font-family:'Noto Sans KR',sans-serif;}
.logo-txt{font-size:15px;font-weight:700;color:#1a3f8f;}
.hd{width:1px;height:28px;background:#e2e8f0;}
.ht{font-size:17px;font-weight:700;color:#1a3f8f;}
.hs{font-size:11px;color:#64748b;margin-top:1px;}
.header-right{display:flex;align-items:center;gap:10px;}
.upd{font-size:11px;color:#94a3b8;}
.ref-btn{background:#1a3f8f;color:#fff;border:none;padding:7px 15px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.ref-btn:hover{background:#0f2d6e;}
.user-chip-d{display:inline-flex;align-items:center;font-size:11px;font-weight:700;background:#eef3ff;color:#1a3f8f;padding:5px 10px;border-radius:14px;}
.logout-btn-d{background:#f1f5f9;color:#64748b;border:none;font-size:11px;font-weight:700;padding:5px 10px;border-radius:14px;cursor:pointer;font-family:inherit;}
.logout-btn-d:hover{background:#e2e8f0;color:#1e293b;}

.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 28px;display:flex;}
.ntab{padding:10px 18px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.ntab.on{color:#1a3f8f;border-bottom-color:#1a3f8f;}
.ntab:hover:not(.on){background:#f8fafc;}

.fbar{background:#f8fafc;border-bottom:1px solid #e2e8f0;padding:8px 28px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 0;}
.fs{display:flex;align-items:center;gap:7px;padding-right:16px;margin-right:16px;border-right:1px solid #e2e8f0;flex-shrink:0;}
.fs:last-child{border-right:none;}
.fl{font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.05em;white-space:nowrap;}
.fbtns{display:flex;gap:4px;flex-wrap:wrap;}
.fb{padding:5px 11px;font-size:12px;font-weight:600;border:1.5px solid #e2e8f0;border-radius:7px;background:#fff;color:#64748b;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .12s;}
.fb.on{background:#1a3f8f;border-color:#1a3f8f;color:#fff;}
.fb:hover:not(.on){background:#f0f4ff;border-color:#1a3f8f;color:#1a3f8f;}
select.fsel{padding:5px 9px;font-size:12px;font-weight:600;border:1.5px solid #e2e8f0;border-radius:7px;background:#fff;color:#1a3f8f;font-family:inherit;outline:none;cursor:pointer;display:none;}
select.fsel.show{display:block;}
input.fdate{padding:5px 9px;font-size:12px;font-weight:600;border:1.5px solid #e2e8f0;border-radius:7px;background:#fff;color:#1a3f8f;font-family:inherit;outline:none;cursor:pointer;display:none;}
input.fdate.show{display:block;}
.fdate-sep{font-size:12px;color:#94a3b8;display:none;margin:0 2px;}
.fdate-sep.show{display:inline;}

.page{display:none;padding:18px 24px;max-width:1600px;margin:0 auto;}
.page.on{display:block;}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px;}
.kpi{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid #eaedf2;border-left:4px solid #1a3f8f;}
.kpi.g{border-left-color:#1a7f4b;}.kpi.r{border-left-color:#e84040;}.kpi.a{border-left-color:#d97706;}.kpi.p{border-left-color:#7c3aed;}
.kpi-lbl{font-size:13px;font-weight:600;color:#94a3b8;letter-spacing:.05em;margin-bottom:6px;}
.kpi-n{font-size:28px;font-weight:700;color:#1e293b;line-height:1;}
.kpi-s{font-size:12px;color:#94a3b8;margin-top:5px;}

.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;}
.sec-title{font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase;}
.tog-btn{font-size:11px;font-weight:600;color:#1a3f8f;cursor:pointer;background:none;border:none;font-family:inherit;}

.collapse-body{overflow:hidden;}
.row-half{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
.row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
.ccard{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid #eaedf2;margin-bottom:12px;}
.ccard-title{font-size:13px;font-weight:700;color:#1e293b;margin-bottom:2px;}
.ccard-sub{font-size:11px;color:#94a3b8;margin-bottom:12px;}
#trend-title{font-size:26px;font-weight:700;color:#1e293b;margin-bottom:6px;letter-spacing:-0.4px;}
#trend-sub{font-size:15px;font-weight:700;color:#475569;margin-bottom:14px;letter-spacing:.02em;}

.fac-grid{display:grid;gap:12px;margin-bottom:12px;}
.fac-card{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid #eaedf2;}
.fac-card-hdr{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.fac-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.fac-name{font-size:14px;font-weight:700;}
.fac-kpi{display:flex;gap:16px;margin-bottom:12px;}
.fac-kpi-item{display:flex;flex-direction:column;gap:2px;}
.fac-kpi-val{font-size:20px;font-weight:700;}
.fac-kpi-lbl{font-size:10px;color:#94a3b8;}
.model-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.model-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:14px;font-size:11.5px;font-weight:600;border:1px solid transparent;}
.model-chip .mc-name{font-weight:700;}
.model-chip .mc-count{font-weight:700;}
.model-sections{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.model-section{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;}
.model-section-row{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:10px;align-items:center;}
.model-section-name{font-size:14px;font-weight:800;padding-right:10px;border-right:2px solid #cbd5e1;line-height:1.1;}
.ms-stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.ms-val{font-size:18px;font-weight:800;line-height:1;}
.ms-lbl{font-size:10px;color:#64748b;font-weight:700;letter-spacing:.04em;}
.mini-chart-wrap{position:relative;height:80px;margin-top:8px;}
.mini-chart-wrap.tall{height:100px;}

/* 빈 상태 */
.empty-dash{display:flex;flex-direction:column;align-items:center;padding:80px 20px;color:#94a3b8;text-align:center;}
.empty-dash .ei{font-size:48px;margin-bottom:16px;}
.empty-dash .et{font-size:16px;font-weight:700;color:#64748b;margin-bottom:8px;}
.empty-dash .es{font-size:13px;line-height:1.7;}

/* 사진 기록 - 행 리스트 + 페이지네이션 */
.photo-record-row{background:#fff;border:1px solid #eaedf2;border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(15,45,110,0.04);}
.prr-header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f8fafc;border-bottom:1px solid #f1f5f9;font-size:13px;flex-wrap:wrap;}
.prr-fac{font-weight:700;padding:3px 10px;border-radius:10px;font-size:12px;}
.prr-model{font-weight:700;color:#1e293b;font-size:13px;}
.prr-author{font-size:11px;color:#64748b;font-weight:600;}
.prr-spacer{flex:1;}
.prr-act{font-weight:700;padding:3px 10px;border-radius:10px;font-size:12px;}
.prr-act.fix{background:#e6f5ee;color:#1a7f4b;}
.prr-act.swp{background:#fef0ee;color:#e84040;}
.prr-time{font-size:11px;color:#94a3b8;font-weight:600;}
.prr-body{display:flex;gap:14px;padding:12px 14px;}
.prr-imgs{display:flex;gap:8px;flex-shrink:0;}
.prr-imgs img{width:140px;height:105px;object-fit:cover;border-radius:8px;cursor:pointer;background:#f1f5f9;border:1px solid #e2e8f0;}
.prr-imgs img:hover{opacity:.85;}
.prr-details{flex:1;display:flex;flex-direction:column;gap:7px;font-size:13px;min-width:0;}
.prr-detail-row{display:flex;align-items:baseline;gap:10px;}
.prr-detail-row .lbl{width:64px;font-size:11px;color:#94a3b8;font-weight:700;flex-shrink:0;text-align:right;letter-spacing:.02em;}
.prr-detail-row .val{color:#1e293b;line-height:1.4;}
.prr-defect{font-weight:700;}
.prr-sub{color:#1a3f8f;font-weight:600;}
.prr-memo{margin-top:6px;padding:8px 12px;background:#f8fafc;border-radius:6px;font-size:12px;color:#475569;border-left:3px solid #cbd5e1;line-height:1.5;}
.page-ctrl{display:flex;justify-content:center;align-items:center;gap:6px;margin:14px 0;flex-wrap:wrap;}
.page-btn{min-width:34px;height:32px;padding:0 10px;border:1.5px solid #e2e8f0;background:#fff;font-size:13px;font-weight:600;color:#64748b;border-radius:7px;cursor:pointer;font-family:inherit;transition:all .12s;}
.page-btn.active{background:#1a3f8f;border-color:#1a3f8f;color:#fff;}
.page-btn:hover:not(.active):not(:disabled){background:#f0f4ff;color:#1a3f8f;border-color:#1a3f8f;}
.page-btn:disabled{opacity:.4;cursor:not-allowed;}
.page-ellipsis{padding:0 4px;color:#94a3b8;font-weight:600;font-size:13px;}
.page-info{font-size:12px;color:#64748b;margin:0 8px;font-weight:600;}
@media(max-width:700px){
  .prr-body{flex-direction:column;}
  .prr-imgs{width:100%;}
  .prr-imgs img{width:calc(33.33% - 6px);height:80px;}
  .prr-detail-row .lbl{width:54px;}
}

.twrap{overflow-x:auto;margin-top:10px;}
table{width:100%;border-collapse:collapse;}
th{padding:8px 12px;font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.04em;text-align:left;border-bottom:2px solid #f1f5f9;white-space:nowrap;background:#f8fafc;}
td{padding:9px 12px;font-size:12px;color:#1e293b;border-bottom:1px solid #f8fafc;white-space:nowrap;}
tr:hover td{background:#f8fafc;}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;}
.b-fix{background:#e6f5ee;color:#1a7f4b;}.b-swp{background:#fef0ee;color:#e84040;}
.b-cams{background:#eef3ff;color:#1a3f8f;}.b-kia{background:#fff8ec;color:#d97706;}.b-mix{background:#f5f3ff;color:#7c3aed;}

@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(3,1fr);}.row-4{grid-template-columns:1fr 1fr;}}
@media(max-width:700px){.kpi-row{grid-template-columns:1fr 1fr;}.row-half,.row-3,.row-4{grid-template-columns:1fr;}.page{padding:12px 10px;}.header,.nav,.fbar{padding-left:12px;padding-right:12px;}}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-wrap">
      <span class="logo-cams">(주) 캠스</span>
    </div>
    <div class="hd"></div>
    <div><div class="ht">범퍼 수정 현황</div><div class="hs">KIA 광주 캠스 상주 품질 현황</div></div>
  </div>
  <div class="header-right">
    <div class="upd" id="upd"></div>
    <div class="user-chip-d" id="user-info" style="display:none;"></div>
    <button class="logout-btn-d" id="logout-btn" onclick="doLogout()" style="display:none;">로그아웃</button>
    <button class="ref-btn" onclick="loadAll()">↻ 새로고침</button>
  </div>
</div>

<div class="nav">
  <div class="ntab on" onclick="showPage('dash',this)">📊 대시보드</div>
  <div class="ntab" onclick="showPage('photo',this)">📷 사진 기록</div>
  <div class="ntab" onclick="showPage('rec',this)">📋 상세 기록</div>
</div>

<div class="fbar">
  <div class="fs">
    <span class="fl">기간</span>
    <div class="fbtns">
      <button class="fb on" onclick="setR('day',this)">일별</button>
      <button class="fb" onclick="setR('week',this)">주간</button>
      <button class="fb" onclick="setR('month',this)">월간</button>
      <button class="fb" onclick="setR('quarter',this)">분기</button>
      <button class="fb" onclick="setR('year',this)">연간</button>
      <button class="fb" onclick="setR('all',this)">전체</button>
    </div>
    <!-- 일별: 날짜 1개 -->
    <input type="date" class="fdate" id="sel-day" onchange="loadAll()">
    <!-- 주간: 시작~종료 -->
    <input type="date" class="fdate" id="sel-week-s" onchange="loadAll()">
    <span class="fdate-sep" id="sep-week">~</span>
    <input type="date" class="fdate" id="sel-week-e" onchange="loadAll()">
    <!-- 월간 -->
    <select class="fsel" id="sel-y-month" onchange="loadAll()"></select>
    <select class="fsel" id="sel-month" onchange="loadAll()">
      <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
      <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
      <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
      <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
    </select>
    <!-- 분기 -->
    <select class="fsel" id="sel-y-quarter" onchange="loadAll()"></select>
    <select class="fsel" id="sel-quarter" onchange="loadAll()">
      <option value="1">1분기 (1~3월)</option>
      <option value="2">2분기 (4~6월)</option>
      <option value="3">3분기 (7~9월)</option>
      <option value="4">4분기 (10~12월)</option>
    </select>
    <!-- 연간 -->
    <select class="fsel" id="sel-year" onchange="loadAll()"></select>
  </div>
  <div class="fs">
    <span class="fl">공장</span>
    <div class="fbtns" id="fac-btns">
      <button class="fb on" onclick="setF('',this)">전체</button>
      <button class="fb" onclick="setF('1공장',this)">1공장</button>
      <button class="fb" onclick="setF('2공장',this)">2공장</button>
      <button class="fb" onclick="setF('3공장',this)">3공장</button>
    </div>
  </div>
  <div class="fs" id="model-fs" style="display:none;">
    <span class="fl">차종</span>
    <div class="fbtns" id="model-btns"></div>
  </div>
  <div class="fs">
    <span class="fl">조치</span>
    <div class="fbtns">
      <button class="fb on" onclick="setA('',this)">전체</button>
      <button class="fb" onclick="setA('수정',this)">수정</button>
      <button class="fb" onclick="setA('교환',this)">교환</button>
    </div>
  </div>
  <div class="fs">
    <span class="fl">귀책처</span>
    <div class="fbtns">
      <button class="fb on" onclick="setResp('',this)">전체</button>
      <button class="fb" onclick="setResp('캠스',this)">캠스</button>
      <button class="fb" onclick="setResp('기아',this)">기아</button>
      <button class="fb" onclick="setResp('복합',this)">복합</button>
    </div>
  </div>
</div>

<!-- 대시보드 -->
<div class="page on" id="page-dash">
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-lbl">총 처리 건수</div><div class="kpi-n" id="k0">-</div><div class="kpi-s">기간 합계</div></div>
    <div class="kpi g"><div class="kpi-lbl">수정</div><div class="kpi-n" id="k1">-</div><div class="kpi-s" id="k1s">-</div></div>
    <div class="kpi r"><div class="kpi-lbl">교환</div><div class="kpi-n" id="k2">-</div><div class="kpi-s" id="k2s">-</div></div>
    <div class="kpi a"><div class="kpi-lbl">캠스 귀책</div><div class="kpi-n" id="k3">-</div><div class="kpi-s" id="k3s">-</div></div>
    <div class="kpi p"><div class="kpi-lbl">기아/복합 귀책</div><div class="kpi-n" id="k4">-</div><div class="kpi-s" id="k4s">-</div></div>
  </div>

  <div id="dash-content">
    <!-- 데이터 있을 때 렌더 -->
  </div>
</div>

<!-- 사진 기록 -->
<div class="page" id="page-photo">
  <div class="ccard">
    <div class="ccard-title">사진 기록</div>
    <div class="ccard-sub" id="photo-sub">현재 필터 기준 사진이 있는 기록을 표시합니다</div>
    <div class="page-ctrl" id="photo-page-ctrl-top"></div>
    <div id="photo-list" style="margin-top:6px;"></div>
    <div class="page-ctrl" id="photo-page-ctrl-bot"></div>
  </div>
</div>

<!-- 사진 모달 -->
<div id="photo-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;align-items:center;justify-content:center;flex-direction:column;" onclick="closePhotoModal()">
  <img id="photo-modal-img" onclick="event.stopPropagation()" style="max-width:90vw;max-height:80vh;border-radius:8px;object-fit:contain;cursor:default;">
  <div id="photo-modal-info" style="color:#fff;font-size:13px;margin-top:12px;text-align:center;"></div>
</div>

<!-- 상세 기록 -->
<div class="page" id="page-rec">
  <div class="ccard">
    <div class="ccard-title">상세 기록</div>
    <div class="ccard-sub" id="tbl-sub">-</div>
    <div class="twrap">
      <table>
        <thead><tr>
          <th>날짜</th><th>시간</th><th>공장</th><th>차종</th><th>구분</th>
          <th>C/NO</th><th>색상</th><th>조치</th><th>불량유형</th><th>교환부품</th><th>책임구</th><th>비고</th><th>등록자</th>
        </tr></thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API='http://localhost:8000';
const LS_AUTH_KEY = 'bumper_employee';

// ── 인증 체크 (미로그인 시 / 로 이동) ────────────────────────────────────────
function getStoredEmployee(){
  try { return JSON.parse(localStorage.getItem(LS_AUTH_KEY) || 'null'); }
  catch(e) { return null; }
}
function doLogout(){
  if(!confirm('로그아웃 하시겠습니까?')) return;
  localStorage.removeItem(LS_AUTH_KEY);
  window.location.href = '/';
}
(function authGate(){
  const emp = getStoredEmployee();
  if(!emp){
    window.location.href = '/';
    return;
  }
  // 헤더에 사용자 정보 표시 (DOM이 위쪽에 정의되어 있어 즉시 접근 가능)
  const ui = document.getElementById('user-info');
  if(ui){
    ui.textContent = `${emp.name||'-'}${emp.department?' · '+emp.department:''}`;
    ui.style.display = 'inline-flex';
  }
  const lb = document.getElementById('logout-btn');
  if(lb) lb.style.display = 'inline-block';
})();

const CAR_MODELS = {
  '1공장':['OV1','SP3'],
  '2공장':['NQ5 PE'],
  '3공장':['PU','C-PAD']
};
const FAC_COLORS = {'1공장':'#1a3f8f','2공장':'#1a7f4b','3공장':'#e84040'};
const MODEL_COLORS = {
  'OV1':'#1a3f8f','SP3':'#4a6fbd',
  'NQ5 PE':'#1a7f4b',
  'PU':'#e84040','C-PAD':'#f08080'
};

let curR='day', curF='', curM='', curPage='dash', curAction='', curResp='';
const CH={};

function buildYearOpts(selId) {
  const sel = document.getElementById(selId);
  sel.innerHTML = '';

function filt(raw){
  const pad=n=>String(n).padStart(2,'0');
  let d=[...raw];
  if(curF) d=d.filter(r=>r.factory===curF);
  if(curM) d=d.filter(r=>r.model===curM);
  if(curAction) d=d.filter(r=>r.action===curAction);
  if(curResp) d=d.filter(r=>r.resp===curResp);

  if(curR==='day'){
    const sel=document.getElementById('sel-day').value;
    return sel ? d.filter(r=>r.date===sel) : d;
  }
  if(curR==='week'){
    const ws=document.getElementById('sel-week-s').value;
    const we=document.getElementById('sel-week-e').value;
    return d.filter(r=>r.date>=ws&&r.date<=we);
  }
  if(curR==='month'){
    const y=document.getElementById('sel-y-month').value;
    const mv=document.getElementById('sel-month').value;
    return d.filter(r=>r.date?.startsWith(y+'-'+pad(mv)));
  }
  if(curR==='quarter'){
    const y=document.getElementById('sel-y-quarter').value;
    const q=parseInt(document.getElementById('sel-quarter').value);
    const sm=(q-1)*3+1, em=q*3;
    return d.filter(r=>{
      if(!r.date?.startsWith(y)) return false;
      const mo=parseInt(r.date.slice(5,7));
      return mo>=sm && mo<=em;
    });
  }
  if(curR==='year'){
    const y=document.getElementById('sel-year').value;
    return d.filter(r=>r.date?.startsWith(y));
  }
  return d;
}

function renderKPI(d){
  const t=d.length,fix=d.filter(r=>r.action==='수정').length,swp=d.filter(r=>r.action==='교환').length;

  document.getElementById('k0').textContent=t.toLocaleString();
  document.getElementById('k1').textContent=fix.toLocaleString();document.getElementById('k1s').textContent=t?Math.round(fix/t*100)+'%':'-';
  document.getElementById('k2').textContent=swp.toLocaleString();document.getElementById('k2s').textContent=t?Math.round(swp/t*100)+'%':'-';
  document.getElementById('k3').textContent=cams.toLocaleString();document.getElementById('k3s').textContent=t?Math.round(cams/t*100)+'%':'-';
  document.getElementById('k4').textContent=kia.toLocaleString();document.getElementById('k4s').textContent=t?Math.round(kia/t*100)+'%':'-';

const centerDataLabelPlugin={
  id:'centerDataLabel',
  afterDatasetsDraw(chart){
    const {ctx}=chart;
    chart.data.datasets.forEach((dataset,di)=>{
      const meta=chart.getDatasetMeta(di);
      meta.data.forEach((bar,i)=>{
        const val=dataset.data[i];
        if(val==null||val===0) return;
        const barH=Math.abs(bar.base-bar.y);
        ctx.save();
        ctx.fillStyle='#fff';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.shadowColor='rgba(0,0,0,0.45)';
        ctx.shadowBlur=2;
        const cy=bar.y+barH/2;
        if(barH>=64){
          // 두 줄: "수정"/"교환" 라벨 + 숫자(2배 폰트)
          ctx.font='800 18px "Noto Sans KR", sans-serif';
          ctx.fillText(dataset.label, bar.x, cy-18);
          ctx.font='900 28px "Noto Sans KR", sans-serif';
          ctx.fillText(val.toLocaleString(), bar.x, cy+14);
        } else if(barH>=24){
          // 작은 막대: 숫자만
          ctx.font='800 18px "Noto Sans KR", sans-serif';
          ctx.fillText(val.toLocaleString(), bar.x, cy);
        }
        ctx.restore();
      });
    });
  }
};

const doughnutCenterLabelPlugin={
  id:'doughnutCenterLabel',
  afterDatasetsDraw(chart){
    const {ctx}=chart;
    const meta=chart.getDatasetMeta(0);
    const ds=chart.data.datasets[0];
    if(!ds) return;
    const total=(ds.data||[]).reduce((s,v)=>s+(Number(v)||0),0);
    if(!total) return;
    meta.data.forEach((arc,i)=>{
      const val=Number(ds.data[i])||0;
      if(val<=0) return;
      // arc가 너무 작으면 라벨 생략
      const ratio=val/total;
      if(ratio<0.04) return;
      const pos=arc.tooltipPosition?arc.tooltipPosition():{x:arc.x,y:arc.y};
      ctx.save();
      ctx.fillStyle='#fff';
      ctx.font='800 14px "Noto Sans KR", sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,0.45)';
      ctx.shadowBlur=2;
      ctx.fillText(val.toLocaleString(), pos.x, pos.y);
      ctx.restore();
    });
  }
};

const barTopLabelPlugin={

    const {ctx}=chart;

    const yOpt=chart.options.scales&&chart.options.scales.y;

    chart.data.datasets.forEach((dataset,di)=>{
      const meta=chart.getDatasetMeta(di);
      meta.data.forEach((bar,i)=>{

          if(barH<14){ctx.restore();return;}
          ctx.fillStyle='#fff';

          ctx.textBaseline='middle';

          ctx.fillText(val.toLocaleString(), bar.x, bar.y - 3);
        }
        ctx.restore();
      });
    });
  }
};

function renderTrend(data){
  const dates=getDates(data);
  const fs=curF?[curF]:['1공장','2공장','3공장'];
  const titleEl=document.getElementById('trend-title');
  const subEl=document.getElementById('trend-sub');

  const startDate=dates[0]||'-';
  const endDate=dates[dates.length-1]||'-';
  if(titleEl) titleEl.textContent='공장별 범퍼 수정 현황 (수정/교환)';
  if(subEl){
    if(startDate==='-'){
      subEl.textContent='조회기간: 데이터 없음';
    } else if(startDate===endDate){
      subEl.textContent=`조회날짜: ${startDate}`;
    } else {
      subEl.textContent=`조회기간: ${startDate} ~ ${endDate}`;
    }
  }

  const fixCounts=fs.map(f=>data.filter(r=>r.factory===f&&r.action==='수정').length);
  const swpCounts=fs.map(f=>data.filter(r=>r.factory===f&&r.action==='교환').length);

  if(CH['c-trend']) CH['c-trend'].destroy();
  const el=document.getElementById('c-trend');

  CH['c-trend']=new Chart(el,{
    type:'bar',
    data:{

      datasets:[
        {
          label:'수정',
          data:fixCounts,
          backgroundColor:fs.map(f=>FAC_FIX_COLORS[f]),
          borderRadius:6,
          borderSkipped:false,
          categoryPercentage:0.7,
          barPercentage:0.9
        },
        {
          label:'교환',
          data:swpCounts,
          backgroundColor:fs.map(f=>FAC_SWP_COLORS[f]),
          borderRadius:6,
          borderSkipped:false,
          categoryPercentage:0.7,
          barPercentage:0.9
        }
      ]

    options:{
      responsive:true,
      plugins:{
        legend:{
          position:'bottom',
          labels:{
            font:{size:12,weight:'600'},boxWidth:14,padding:12,
            generateLabels:function(){
              return [
                {text:'수정 (연한색)',fillStyle:'#b8b8b8',strokeStyle:'#b8b8b8',lineWidth:0,hidden:false,index:0},
                {text:'교환 (진한색)',fillStyle:'#3a3a3a',strokeStyle:'#3a3a3a',lineWidth:0,hidden:false,index:1}

  const cols=fs.length===1?'1fr':fs.length===2?'1fr 1fr':'1fr 1fr 1fr';
  container.style.gridTemplateColumns=cols;
  container.innerHTML='';
  fs.forEach(f=>{
    const fd=data.filter(r=>r.factory===f);
    const t=fd.length,fix=fd.filter(r=>r.action==='수정').length,swp=fd.filter(r=>r.action==='교환').length;
    const models=CAR_MODELS[f];
    const col=FAC_COLORS[f];
    const fixColor=FAC_FIX_COLORS[f];
    const swpColor=FAC_SWP_COLORS[f];
    const facKey=f.replace('공장','');
    const div=document.createElement('div');
    div.className='fac-card';

    const bodyHtml=`
      <div class="model-sections">
        ${models.map((m,i)=>{
          const md=fd.filter(r=>r.model===m);
          const mt=md.length;
          const mfix=md.filter(r=>r.action==='수정').length;
          const mswp=md.filter(r=>r.action==='교환').length;
          const mcol=MODEL_COLORS[m];
          return `
            <div class="model-section" style="border-left:4px solid ${mcol};">
              <div class="model-section-row">
                <div class="model-section-name" style="color:${mcol}">${m}</div>
                <div class="ms-stat"><div class="ms-val">${mt.toLocaleString()}</div><div class="ms-lbl">총 건수</div></div>
                <div class="ms-stat"><div class="ms-val" style="color:#1a7f4b">${mfix.toLocaleString()}</div><div class="ms-lbl">수정</div></div>
                <div class="ms-stat"><div class="ms-val" style="color:#e84040">${mswp.toLocaleString()}</div><div class="ms-lbl">교환</div></div>
              </div>
              <div class="mini-chart-wrap"><canvas id="c-fac-${facKey}-${i}"></canvas></div>
            </div>`;
        }).join('')}
      </div>`;

    div.innerHTML=`
      <div class="fac-card-hdr">
        <div class="fac-dot" style="background:${col}"></div>
        <div class="fac-name" style="color:${col}">${f}</div>
      </div>
      <div class="fac-kpi">
        <div class="fac-kpi-item"><div class="fac-kpi-val">${t.toLocaleString()}</div><div class="fac-kpi-lbl">총 건수</div></div>
        <div class="fac-kpi-item"><div class="fac-kpi-val" style="color:#1a7f4b">${fix}</div><div class="fac-kpi-lbl">수정</div></div>
        <div class="fac-kpi-item"><div class="fac-kpi-val" style="color:#e84040">${swp}</div><div class="fac-kpi-lbl">교환</div></div>
      </div>
      ${bodyHtml}`;
    container.appendChild(div);

    setTimeout(()=>{
      models.forEach((m,i)=>{
        const md=fd.filter(r=>r.model===m);
        const mfix=md.filter(r=>r.action==='수정').length;
        const mswp=md.filter(r=>r.action==='교환').length;
        renderModelMiniBar(`c-fac-${facKey}-${i}`, mfix, mswp, fixColor, swpColor);
      });
    },50);
  });
}

function renderModelMiniBar(canvasId, fixCount, swpCount, fixColor, swpColor){
  if(CH[canvasId]) CH[canvasId].destroy();
  const el=document.getElementById(canvasId);
  if(!el) return;
  CH[canvasId]=new Chart(el,{
    type:'bar',
    data:{
      labels:['수정','교환'],
      datasets:[{
        data:[fixCount,swpCount],
        backgroundColor:[fixColor,swpColor],
        borderRadius:5,
        borderSkipped:false,
        categoryPercentage:0.7,
        barPercentage:0.85
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>ctx.parsed.y.toLocaleString()+'건'}}
      },
      scales:{
        x:{ticks:{font:{size:11,weight:'700'},color:'#475569'},grid:{display:false}},
        y:{beginAtZero:true,ticks:{font:{size:9}}}
      }
    },
    plugins:[miniCenterDataLabelPlugin]
  });
}

function renderMonthly(raw){
  const fd=curF?raw.filter(r=>r.factory===curF):raw;
  const years=[...new Set(fd.map(r=>r.date?.slice(0,4)))].filter(Boolean).sort();
  const months=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0'));
  const yearColors=['#1a3f8f','#1a7f4b','#e84040','#d97706'];

  function buildDatasets(action){
    const baseColor = action==='수정' ? '#1a7f4b' : '#e84040';
    return years.map((y,yi)=>{
      const col = years.length===1 ? baseColor : yearColors[yi%4];
      return {
        label: y+'년',
        data: months.map(m=>fd.filter(r=>r.date?.startsWith(y+'-'+m)&&r.action===action).length),
        borderColor: col,
        backgroundColor: col+'22',
        tension:.3, pointRadius:3, pointBackgroundColor:col, borderWidth:2
      };
    });
  }

  const lineOpts = {
    maintainAspectRatio:false,
    layout:{padding:{top:28,right:12,bottom:4}},
    scales:{
      y:{beginAtZero:true,ticks:{font:{size:11}},grace:'15%'},
      x:{ticks:{font:{size:12,weight:'600'}}}
    },
    plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:10,padding:8}}}
  };

  mk('c-monthly-fix','line',months.map(m=>m+'월'),buildDatasets('수정'),lineOpts,[lineDataLabelPlugin]);
  mk('c-monthly-swp','line',months.map(m=>m+'월'),buildDatasets('교환'),lineOpts,[lineDataLabelPlugin]);
}
function renderDefect(d){

  const colorMap={'찍힘':'#1a3f8f','긁힘':'#1a7f4b','파손':'#e84040','도장불량':'#d97706','조립불량':'#7c3aed','고무링말림':'#0891b2','티이물':'#db2777','이종':'#65a30d','기타':'#94a3b8'};
  const counts=types.map(t=>({type:t,count:d.filter(r=>r.defect===t).length}))
    .sort((a,b)=>b.count-a.count);
  mk('c-defect','bar',
    counts.map(c=>c.type),
    [{label:'건수',data:counts.map(c=>c.count),backgroundColor:counts.map(c=>colorMap[c.type]),borderRadius:4}],
    {indexAxis:'y',plugins:{legend:{display:false}},layout:{padding:{right:50}}},
    [barEndLabelPlugin]);
}

let photoCurPage = 1;
const PHOTOS_PER_PAGE = 10;

function renderPhotoGrid(data){
  const withPhotos = data.filter(r=>r.photos && r.photos.length>0);
  const sub = document.getElementById('photo-sub');
  const list = document.getElementById('photo-list');
  const ctrlTop = document.getElementById('photo-page-ctrl-top');
  const ctrlBot = document.getElementById('photo-page-ctrl-bot');

  sub.textContent = `사진 있는 기록 ${withPhotos.length}건 / 전체 ${data.length}건`;

  if(!withPhotos.length){
    list.innerHTML=`<div style="text-align:center;padding:60px 20px;color:#94a3b8;">
      <div style="font-size:40px;margin-bottom:12px;">📷</div>
      <div style="font-size:15px;font-weight:700;color:#64748b;margin-bottom:6px;">사진이 없습니다</div>
      <div style="font-size:13px;">상주원 앱에서 사진을 첨부하면 여기에 표시됩니다.</div>
    </div>`;
    ctrlTop.innerHTML='';
    ctrlBot.innerHTML='';
    return;
  }
  // [DEBUG] 작성자 필드 도착 확인용 - 문제 해결되면 제거
  if(withPhotos.length>0){
    const sample=withPhotos[0];
    console.log('[photo-records] sample record fields:', {
      id: sample.id,
      submitted_by_id: sample.submitted_by_id,
      submitted_by_name: sample.submitted_by_name,
      submitted_by_dept: sample.submitted_by_dept,
      keys: Object.keys(sample)
    });
  }

  const sorted=[...withPhotos].sort((a,b)=>(b.submitted_at||'').localeCompare(a.submitted_at||''));

  // 사진 데이터를 글로벌 캐시에 저장
  window._photoData = {};
  window._photoInfo = {};
  sorted.forEach(r=>{
    window._photoData[r.id] = r.photos;
    window._photoInfo[r.id] = `${r.factory} ${r.model} ${r.position} | ${r.defect} | C/NO:${r.cno}`;
  });

  // 페이지네이션
  const totalPages = Math.max(1, Math.ceil(sorted.length / PHOTOS_PER_PAGE));
  if(photoCurPage > totalPages) photoCurPage = 1;
  const startIdx = (photoCurPage - 1) * PHOTOS_PER_PAGE;
  const pageItems = sorted.slice(startIdx, startIdx + PHOTOS_PER_PAGE);

  const FC={'1공장':'#1a3f8f','2공장':'#1a7f4b','3공장':'#e84040'};

  list.innerHTML = pageItems.map(r=>{
    const fc=FC[r.factory]||'#94a3b8';
    const actClass = r.action==='수정'?'fix':'swp';
    const imgs=r.photos.map((p,i)=>{
      const isValid = typeof p==='string' && /^data:image\/[a-z]+;base64,/.test(p);
      const isHttp = typeof p==='string' && /^https?:\/\//.test(p);
      const safeSrc = isValid||isHttp ? p : '';
      return `<img src="${safeSrc}" data-rid="${r.id}" data-pidx="${i}"
        onclick="openPhotoFromImg(event,this)"
        onerror="this.style.background='#fee2e2';this.alt='이미지 손상';this.removeAttribute('src');">`;
    }).join('');
    const timeStr = r.submitted_at ? r.submitted_at.slice(11,16) : '';
    const authorTxt = r.submitted_by_name
      ? r.submitted_by_name + (r.submitted_by_dept?' · '+r.submitted_by_dept:'')
      : '';
    return `
    <div class="photo-record-row">
      <div class="prr-header">
        <span class="prr-fac" style="background:${fc}1a;color:${fc};">${r.factory||'-'}</span>
        <span class="prr-model">${r.model||'-'} · ${r.position||''}</span>
        ${authorTxt?`<span class="prr-author">${escapeHtml(authorTxt)}</span>`:''}
        <span class="prr-spacer"></span>
        <span class="prr-act ${actClass}">${r.action||'-'}</span>
        <span class="prr-time">${r.date||''}${timeStr?' '+timeStr:''}</span>
      </div>
      <div class="prr-body">
        <div class="prr-imgs">${imgs}</div>
        <div class="prr-details">
          <div class="prr-detail-row">
            <span class="lbl">불량유형</span>
            <span class="val prr-defect">${r.defect||'-'}${r.defect_sub?` <span class="prr-sub">(${escapeHtml(r.defect_sub)})</span>`:''}</span>
          </div>
          <div class="prr-detail-row">
            <span class="lbl">C/NO</span>
            <span class="val" style="font-family:monospace;font-weight:600;">${r.cno||'-'}</span>
          </div>
          <div class="prr-detail-row">
            <span class="lbl">색상</span>
            <span class="val">${r.color||'-'}</span>
          </div>
          <div class="prr-detail-row">
            <span class="lbl">귀책</span>
            <span class="val">${r.resp||'-'}</span>
          </div>
          ${r.memo?`<div class="prr-memo">📝 ${escapeHtml(r.memo)}</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  const ctrlHtml = renderPageCtrl(photoCurPage, totalPages, sorted.length);
  ctrlTop.innerHTML = ctrlHtml;
  ctrlBot.innerHTML = ctrlHtml;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderPageCtrl(cur, total, totalItems){
  if(total <= 1){
    return `<span class="page-info">총 ${totalItems}건</span>`;
  }
  let html = `<span class="page-info">${cur} / ${total} 페이지 · 총 ${totalItems}건</span>`;
  html += `<button class="page-btn" ${cur===1?'disabled':''} onclick="goPhotoPage(1)">«</button>`;
  html += `<button class="page-btn" ${cur===1?'disabled':''} onclick="goPhotoPage(${cur-1})">‹</button>`;
  // 페이지 번호 (현재 주변 + 처음/끝)
  const range = getPageRange(cur, total);
  for(const p of range){
    if(p === '...'){
      html += `<span class="page-ellipsis">…</span>`;
    } else {
      html += `<button class="page-btn ${p===cur?'active':''}" onclick="goPhotoPage(${p})">${p}</button>`;
    }
  }
  html += `<button class="page-btn" ${cur===total?'disabled':''} onclick="goPhotoPage(${cur+1})">›</button>`;
  html += `<button class="page-btn" ${cur===total?'disabled':''} onclick="goPhotoPage(${total})">»</button>`;
  return html;
}

function getPageRange(cur, total){
  if(total <= 7) return Array.from({length:total},(_,i)=>i+1);
  const range = [1];
  if(cur > 3) range.push('...');
  for(let p=Math.max(2, cur-1); p<=Math.min(total-1, cur+1); p++) range.push(p);
  if(cur < total-2) range.push('...');
  range.push(total);
  return range;
}

function goPhotoPage(p){
  photoCurPage = p;
  renderPhotoGrid(window._data || []);
  // 위 페이지 컨트롤로 스크롤
  const top = document.getElementById('photo-page-ctrl-top');
  if(top) top.scrollIntoView({behavior:'smooth', block:'start'});
}

function openPhotoFromImg(ev, img){
  if(ev && ev.stopPropagation) ev.stopPropagation();
  const rid=img.dataset.rid;
  const idx=parseInt(img.dataset.pidx,10);
  if(isNaN(idx)) return;
  const photos=(window._photoData||{})[rid];
  const info=(window._photoInfo||{})[rid] || '';
  if(!photos || !photos[idx]) return;
  const m=document.getElementById('photo-modal');
  document.getElementById('photo-modal-img').src=photos[idx];
  document.getElementById('photo-modal-info').textContent=info+(photos.length>1?` (${idx+1}/${photos.length})`:'');
  m.style.display='flex';
}
function openPhotoModal(src, info){
  if(window.event) window.event.stopPropagation();
  const m=document.getElementById('photo-modal');
  document.getElementById('photo-modal-img').src=src;
  document.getElementById('photo-modal-info').textContent=info;
  m.style.display='flex';
}

function closePhotoModal(){
  document.getElementById('photo-modal').style.display='none';
}

    <td><span class="badge ${r.resp==='캠스'?'b-cams':r.resp==='기아'?'b-kia':'b-mix'}">${r.resp||''}</span></td>
    <td style="color:#64748b">${r.memo||'-'}</td>
    <td style="font-weight:600;color:#1a3f8f">${r.submitted_by_name?r.submitted_by_name+(r.submitted_by_dept?' · '+r.submitted_by_dept:''):'-'}</td>
  </tr>`).join('');
}
